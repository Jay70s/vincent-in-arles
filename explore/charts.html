<main class="ch-main">
  <div class="ch-head">
    <p class="kick">아를 편지 173편의 통계</p>
    <h1>데이터로 보는 15개월</h1>
    <p>편지를 세어보면 이야기가 보입니다. 아래 모든 숫자는 이 위키의 편지 노트에서
    자동 집계한 것이며, 막대나 칸에 마우스를 올리면 값이 표시됩니다.</p>
  </div>

  <figure class="fig" id="figTimeline">
    <h2>편지의 밀물과 썰물</h2>
    <p class="sub">월별 편지 수 · 1888년 2월 ~ 1889년 5월</p>
    <div class="plot"></div>
    <p class="note"><b>읽는 법</b> — 10월에 20편으로 최고조에 이릅니다(고갱을 맞을 준비).
    그런데 고갱이 도착한 11월과 12월에는 10편으로 급감합니다. 같은 집에 살면 편지를 쓸 이유가 없기 때문입니다.
    1월에 다시 13편으로 튀어오르는 것은 위기 이후 안심시켜야 할 사람이 많아졌다는 뜻입니다.</p>
  </figure>

  <figure class="fig" id="figThemes">
    <h2>무엇을 반복해서 말했는가</h2>
    <p class="sub">주제별 편지 수 · 한 편지에 여러 주제가 붙을 수 있습니다</p>
    <div class="plot"></div>
    <p class="note"><b>읽는 법</b> — 1·2위가 <b>고갱과의 협업</b>과 <b>재정과 테오</b>입니다.
    그의 아를은 결국 &lsquo;함께 그릴 사람&rsquo;과 &lsquo;그릴 수 있게 해줄 돈&rsquo; 사이의 15개월이었습니다.</p>
  </figure>

  <figure class="fig" id="figFlow">
    <h2>주제는 계절처럼 바뀐다</h2>
    <p class="sub">상위 6개 주제의 월별 추이 · 각 칸의 세로 눈금은 동일</p>
    <div class="plot sm-grid"></div>
    <p class="note"><b>읽는 법</b> — <b>고갱과의 협업</b>은 여름부터 부풀어 10월에 정점을 찍고,
    <b>정신건강</b>은 12월 위기 이후 1월에 솟구칩니다. 주제 곡선만 봐도 그해의 사건 순서가 드러납니다.</p>
  </figure>

  <figure class="fig" id="figAddr">
    <h2>누구에게 썼는가</h2>
    <p class="sub">수신인별 편지 수</p>
    <div class="plot"></div>
    <p class="note"><b>읽는 법</b> — 173편 중 129편이 동생 테오에게 갔습니다.
    나머지를 다 합쳐도 테오의 3분의 1이 안 됩니다.</p>
  </figure>

  <figure class="fig" id="figPeople">
    <h2>편지에 가장 자주 등장한 사람</h2>
    <p class="sub">상위 20명 · 언급된 편지 수</p>
    <div class="plot"></div>
    <p class="note"><b>읽는 법</b> — 1위 고갱(116편)은 2위 베르나르(76편)를 크게 앞섭니다.
    3·4위가 <b>들라크루아</b>와 <b>몽티첼리</b>인 것도 흥미롭습니다 — 살아있는 동료보다
    죽은 화가를 더 자주 이야기한 셈입니다.</p>
  </figure>

  <figure class="fig" id="figCo">
    <h2>어떤 주제가 함께 나타나는가</h2>
    <p class="sub">상위 8개 주제의 동시 출현 횟수 · 색이 진할수록 더 자주 같은 편지에</p>
    <div class="plot"></div>
    <p class="note"><b>읽는 법</b> — <b>고갱과의 협업 × 재정과 테오</b>가 가장 짙습니다.
    고갱을 부르는 일은 언제나 돈 이야기와 같은 문단에 있었습니다.</p>
  </figure>

  <figure class="fig" id="figLen">
    <h2>편지는 얼마나 길었나</h2>
    <p class="sub">편지별 영어 번역 글자 수 · 연대순</p>
    <div class="plot"></div>
    <p class="note"><b>읽는 법</b> — 가장 긴 편지들은 베르나르에게 보낸 예술론 편지와
    테오에게 계획을 설명하는 편지들입니다. 위기 직후의 편지는 유난히 짧습니다.</p>
  </figure>
