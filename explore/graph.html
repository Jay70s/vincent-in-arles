<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지식 그래프 — Vincent Wiki</title>
<meta name="description" content="아를 편지 위키의 508개 노드와 2,085개 연결을 인터랙티브 그래프로 탐색합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/wiki.css?v=20260922f">
<link rel="stylesheet" href="../css/explore.css?v=20260922f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕸️</text></svg>">
</head>
<body class="gv-body">

<header class="wnav">
  <a class="wnav-brand" href="../wiki/">V<span>·</span>Wiki</a>
  <nav class="wnav-links">
    <a href="../wiki/#explore" data-en="Explore">둘러보기</a>
    <a href="../wiki/#maps" data-en="Maps">지도</a>
    <a href="../wiki/#themes" data-en="Themes">주제</a>
    <a href="../wiki/#art" data-en="The Paintings">아를의 그림</a>
    <a href="../wiki/#daily" data-en="The Days">아를의 나날</a>
    <a href="../wiki/#people" data-en="People">인물</a>
    <a href="../wiki/#letters" data-en="Letters">편지</a>
    <a href="../index.html" data-en="Arles Site">Arles 사이트</a>
  </nav>
  <div class="langsw" role="group" aria-label="Language">
    <button type="button" data-setlang="ko">KOR</button>
    <button type="button" data-setlang="en">ENG</button>
  </div>
</header>

<div class="gv-wrap">
  <aside class="gv-panel">
    <h1 data-en="Knowledge Graph">지식 그래프</h1>
    <p class="gv-lede" data-en="A constellation made by letters, people and themes referring to one another. <strong>Drag</strong> a node to move it; click to open its wiki page.">편지·인물·주제가 서로를 언급하며 만든 별자리입니다.
    노드를 <strong>끌어 움직이고</strong>, 클릭하면 해당 위키 문서로 갑니다.</p>

    <div class="gv-field">
      <input type="search" id="gvSearch" placeholder="노드 이름 검색…" autocomplete="off">
    </div>

    <div class="gv-legend">
      <label class="lg lg-letter"><input type="checkbox" data-kind="letter" checked><span class="dot"></span>편지 <b id="cLetter">0</b></label>
      <label class="lg lg-person"><input type="checkbox" data-kind="person" checked><span class="dot"></span>인물 <b id="cPerson">0</b></label>
      <label class="lg lg-theme"><input type="checkbox" data-kind="theme" checked><span class="dot"></span>주제 <b id="cTheme">0</b></label>
    </div>

    <div class="gv-field">
      <label class="gv-label"><span data-en="Minimum links">최소 연결 수</span> <b id="degVal">12</b></label>
      <input type="range" id="degFilter" min="3" max="60" value="12">
      <p class="gv-hint" data-en="Raise it to keep only the central people and themes.">값을 올리면 중심 인물·주제만 남습니다.</p>
    </div>

    <div class="gv-info" id="gvInfo">
      <p class="gv-placeholder" data-en="Hover a node to see its details.">노드에 마우스를 올리면 정보가 표시됩니다.</p>
    </div>

    <p class="gv-meta" id="gvMeta"></p>
    <button class="gv-reset" id="gvReset" data-en="Reset view">시점 초기화</button>
  </aside>

  <div class="gv-stage">
    <svg id="gv"></svg>
    <div class="gv-tip" id="gvTip" hidden></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="../js/graphview.js?v=20260922f"></script>
<script src="../js/wiki-i18n.js?v=20260922f"></script>
</body>
</html>
